name: Test Laravel Docker Local

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: gestion_parcauto
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t laravel-app .

      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL to be ready..."
          for i in {1..10}; do
            docker run --rm --network host mysql:8 \
              mysql -h127.0.0.1 -uroot -psecret -e "SELECT 1;" && break
            sleep 5
          done

      - name: Run Laravel Tests inside container
        run: |
          docker run --rm --network host \
            -e DB_CONNECTION=mysql \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=3306 \
            -e DB_DATABASE=gestion_parcauto \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=secret \
            laravel-app php artisan test
